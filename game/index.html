<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Linh Thú IQX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap">
<style>
/* Layout: a night-shrine arena (scene + command bar) on the left, HUD and evolution line on the right;
   one column under 980px. Everything sits on a pixel grid of --px (3px desktop, 2px phone). */
:root {
  color-scheme: dark;
  --night: #0c0a22;      /* page */
  --ink: #07061a;        /* outlines, text on accent */
  --panel: #17133b;      /* panel fill */
  --panel-hi: #221c52;   /* raised fill */
  --panel-top: #2c2468;  /* hover fill */
  --line: #45399a;       /* pixel borders */
  --text: #f4efff;
  --muted: #a89ed9;
  --gold: #ffd25e;       /* EXP, levels */
  --hp: #ff5f7e; --atk: #ffa64d; --def: #62a8ff; --spd: #6ee7a8;
  --acc: #22d3ee;        /* per pet, set from data */
  --px: 3px;
  --font-ui: "VT323", "Lucida Console", "Courier New", ui-monospace, monospace;
  --font-display: "Bungee", "Arial Black", "Segoe UI Black", Impact, sans-serif;
}
@media (max-width: 640px) { :root { --px: 2px; } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--night) linear-gradient(180deg, #110d2c 0, var(--night) 420px) no-repeat;
  color: var(--text);
  font: 24px/1.2 var(--font-ui);
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
img, canvas { max-width: none; }
h1, h2, h3, p, ol { margin: 0; }
ol { padding: 0; list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* pixel frame: square ring with notched corners, built from four hard shadows */
.pxb {
  --bc: var(--line);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bc), 0 var(--px) 0 0 var(--bc),
    calc(-1 * var(--px)) 0 0 0 var(--bc), var(--px) 0 0 0 var(--bc),
    inset 0 var(--px) 0 0 rgba(255, 255, 255, .06), inset 0 calc(-1 * var(--px)) 0 0 rgba(0, 0, 0, .3);
}

.app {
  max-width: 1260px; margin: 0 auto;
  padding-block: 12px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
}

/* ---------- buttons ---------- */
.btn {
  --bc: var(--line); --bg: var(--panel-hi); --fg: var(--text);
  appearance: none; border: 0; margin: 0; cursor: pointer; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 10px 16px; font-size: 26px; line-height: 1; color: var(--fg); background: var(--bg);
  text-shadow: 2px 2px 0 rgba(0, 0, 0, .45);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bc), 0 var(--px) 0 0 var(--bc),
    calc(-1 * var(--px)) 0 0 0 var(--bc), var(--px) 0 0 0 var(--bc),
    inset 0 calc(-1 * var(--px)) 0 0 rgba(0, 0, 0, .45), inset 0 var(--px) 0 0 rgba(255, 255, 255, .14);
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:hover { --bg: var(--panel-top); }
.btn:active:not(:disabled) {
  transform: translateY(var(--px));
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bc), 0 var(--px) 0 0 var(--bc),
    calc(-1 * var(--px)) 0 0 0 var(--bc), var(--px) 0 0 0 var(--bc),
    inset 0 var(--px) 0 0 rgba(0, 0, 0, .35);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: var(--px) solid var(--text); outline-offset: calc(var(--px) * 2); }
.btn-acc { --bg: var(--acc); --fg: var(--ink); --bc: var(--text); text-shadow: none; }
.btn-acc:hover { --bg: var(--acc); filter: brightness(1.12); }
.btn-gold { --bg: #3a2a10; --fg: var(--gold); --bc: #8a6420; }
.btn-gold:hover { --bg: #4a3614; }
.btn-sm { font-size: 22px; padding: 8px 12px; gap: 8px; }
.btn-xs { font-size: 20px; padding: 5px 10px; }
.btn kbd {
  position: absolute; top: 3px; right: 5px;
  font: inherit; font-size: 16px; line-height: 1; color: inherit; opacity: .55; text-shadow: none;
}
@media (hover: none), (max-width: 700px) { .btn kbd { display: none; } }

.ico { display: inline-block; flex: none; line-height: 0; }
.ico svg { display: block; width: calc(var(--w) * var(--px)); height: calc(var(--h) * var(--px)); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; }
.logo {
  display: flex; align-items: center; gap: 12px; flex: none;
  font: 400 30px/1 var(--font-display); letter-spacing: .01em; color: var(--text);
  text-shadow: 3px 3px 0 var(--ink), 0 3px 0 var(--ink);
}
.logo b { font-weight: 400; color: var(--acc); }
.logo small { display: block; font: 20px/1 var(--font-ui); color: var(--muted); letter-spacing: .04em; text-shadow: none; margin-top: 6px; }
.sys { display: flex; gap: 14px; margin-left: auto; }
#soundBtn[aria-pressed="false"] { --fg: var(--muted); }

/* roster */
.roster { display: flex; gap: 14px; flex-wrap: nowrap; }
.slot {
  --c: var(--line); --bc: var(--line);
  appearance: none; border: 0; cursor: pointer; position: relative;
  display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; min-width: 0;
  background: var(--panel); color: var(--text); text-align: left;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bc), 0 var(--px) 0 0 var(--bc),
    calc(-1 * var(--px)) 0 0 0 var(--bc), var(--px) 0 0 0 var(--bc),
    inset 0 calc(-1 * var(--px)) 0 0 rgba(0, 0, 0, .35);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.slot:hover { background: var(--panel-hi); }
.slot[aria-pressed="true"] { --bc: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--panel)); }
@keyframes nudge { 50% { transform: translateY(calc(var(--px) * -1)); } }
.slot .pic { width: 56px; height: 56px; flex: none; overflow: hidden; background: rgba(0, 0, 0, .28); }
.slot .pic img { width: 56px; height: 56px; object-fit: none; object-position: var(--pp, 50% 0); image-rendering: pixelated; display: block; }
.slot .meta { display: grid; gap: 3px; min-width: 0; }
.slot .nm { font-size: 21px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .lv { font-size: 18px; line-height: 1; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pips { display: inline-flex; gap: calc(var(--px) * 1); }
.pips i { width: calc(var(--px) * 2); height: calc(var(--px) * 2); background: rgba(255, 255, 255, .16); }
.pips i.on { background: var(--c, var(--acc)); }

/* ---------- main grid ---------- */
.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.stage-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; container-type: inline-size; }
.side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; min-width: 0; }
.statskill { container-type: inline-size; }

/* ---------- arena ---------- */
.arena-box { width: 100%; min-width: 0; }
.arena {
  --bc: #5a4cb4;
  position: relative; margin-inline: auto; overflow: hidden; background: #0a0820;
  width: var(--aw, 654px); height: var(--ah, 618px); max-width: 100%;
  user-select: none; -webkit-user-select: none;
}
.scene { position: absolute; inset: 0; }
.scene canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#bg { z-index: 0; }
#glow { z-index: 2; }
.dim {
  position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 50% 58%, rgba(7, 6, 26, .2) 0, rgba(7, 6, 26, .78) 46%, rgba(7, 6, 26, .95) 80%);
  transition: opacity .9s steps(9);
}
.arena.dimmed .dim { opacity: 1; }
.pet-pos {
  position: absolute; z-index: 3; pointer-events: none;
  left: calc(var(--pl) * 1px); top: calc(var(--pt) * 1px);
  width: calc(var(--s) * 192px); height: calc(var(--s) * 192px);
}
.pet-move { position: absolute; inset: 0; }
.pet-move img {
  position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
  filter: brightness(1) invert(0) drop-shadow(0 0 0 transparent);
}
.pet-move img.off { visibility: hidden; }
.pet-pos.sil img:not(.aura-img) { filter: brightness(0) invert(1) drop-shadow(0 0 calc(var(--s) * 3px) var(--acc)); }
/* final form: a pixel-exact outline that follows the silhouette and flickers like flame */
.pet-move img.aura-img { display: none; }
.pet-pos.mythic:not(.sil) img.aura-img {
  display: block;
  --a1: color-mix(in srgb, var(--acc) 45%, #fff);
  --o: calc(var(--s) * 1px);
  filter:
    drop-shadow(var(--o) 0 0 var(--a1)) drop-shadow(calc(var(--o) * -1) 0 0 var(--a1))
    drop-shadow(0 var(--o) 0 var(--a1)) drop-shadow(0 calc(var(--o) * -1) 0 var(--a1))
    drop-shadow(var(--o) 0 0 var(--acc)) drop-shadow(calc(var(--o) * -1) 0 0 var(--acc))
    drop-shadow(0 calc(var(--o) * -1) 0 var(--acc)) drop-shadow(0 calc(var(--o) * -2) 0 color-mix(in srgb, var(--acc) 55%, transparent));
  animation: flame .9s steps(1, end) infinite;
}
@keyframes flame {
  0% { transform: translateY(0); opacity: 1; }
  33% { transform: translateY(calc(var(--s) * -1px)); opacity: .9; }
  66% { transform: translateY(0); opacity: .75; }
}
.pet-pos.sil-in img { transition: filter .6s steps(6); }
.rm .pet-pos.xfade img { transition: opacity 1.6s ease-in-out; }
#fx { z-index: 4; }
.flash { position: absolute; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .75s steps(6, end) forwards; }
.flash.go.soft { animation: flash-soft .9s ease-out forwards; }
.flash.tint { background: var(--acc); }
.flash.tint.go { animation: flash-tint .32s steps(3, end) forwards; }
@keyframes flash { 0% { opacity: 1; } 30% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flash-soft { 0% { opacity: .55; } 100% { opacity: 0; } }
@keyframes flash-tint { 0% { opacity: .55; } 100% { opacity: 0; } }

.pet-hit {
  position: absolute; z-index: 6; background: transparent; border: 0; padding: 0; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pet-hit:focus-visible { outline: var(--px) dashed var(--text); outline-offset: 0; }

.plate {
  position: absolute; z-index: 6; left: calc(var(--s) * 4px); top: calc(var(--s) * 4px);
  display: grid; gap: 4px; padding: 6px 10px 7px; pointer-events: none;
  background: rgba(7, 6, 26, .72);
  box-shadow: 0 0 0 calc(var(--s) * 1px) rgba(255, 255, 255, .12);
}
.plate-nm { font: 400 calc(var(--s) * 5px)/1 var(--font-display); color: var(--text); text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.plate-lv { font-size: calc(var(--s) * 7px); line-height: .8; color: var(--gold); display: flex; align-items: center; gap: 8px; }

.floaters { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
  font-size: calc(var(--s) * 10px); line-height: 1; color: var(--gold);
  text-shadow: calc(var(--s) * 1px) calc(var(--s) * 1px) 0 var(--ink), calc(var(--s) * -1px) calc(var(--s) * 1px) 0 var(--ink), calc(var(--s) * 1px) calc(var(--s) * -1px) 0 var(--ink), calc(var(--s) * -1px) calc(var(--s) * -1px) 0 var(--ink);
  animation: rise 1.3s steps(13, end) forwards;
}
.floater.big { font: 400 calc(var(--s) * 7px)/1 var(--font-display); color: var(--acc); }
.floater.pink { color: #ff8fb4; }
@keyframes rise {
  0% { margin-top: 0; opacity: 1; }
  70% { opacity: 1; }
  77% { opacity: 0; } 84% { opacity: 1; } 92% { opacity: 0; }
  100% { margin-top: calc(var(--s) * -16px); opacity: 0; }
}

.banner {
  position: absolute; z-index: 7; left: 0; right: 0; top: 19%; display: flex; justify-content: center;
  pointer-events: none; visibility: hidden;
}
.banner.go { visibility: visible; }
.banner span {
  font: 400 calc(var(--s) * 8px)/1 var(--font-display); letter-spacing: .02em; color: var(--ink);
  background: var(--acc); padding: calc(var(--s) * 3px) calc(var(--s) * 8px) calc(var(--s) * 2px);
  max-width: calc(100% - var(--s) * 12px); text-align: center; text-wrap: balance;
  box-shadow: 0 calc(var(--s) * -1px) 0 0 var(--text), 0 calc(var(--s) * 1px) 0 0 var(--text), calc(var(--s) * -1px) 0 0 0 var(--text), calc(var(--s) * 1px) 0 0 0 var(--text), calc(var(--s) * 2px) calc(var(--s) * 3px) 0 0 var(--ink);
}
.banner.go span { animation: banner 1.7s steps(1, end) forwards; }
@keyframes banner {
  0% { transform: scaleX(0); } 4% { transform: scaleX(.4); } 8% { transform: scaleX(.85); } 12% { transform: scaleX(1.06); } 16% { transform: scaleX(1); }
  84% { transform: scaleX(1); opacity: 1; } 88% { transform: scaleX(1.04); } 92% { transform: scaleX(.6) scaleY(.6); } 96% { transform: scaleX(.2) scaleY(.2); } 100% { transform: scaleX(0); opacity: 0; }
}

.skip { position: absolute; z-index: 9; top: calc(var(--s) * 4px); right: calc(var(--s) * 4px); }

.dialog {
  position: absolute; z-index: 8; left: calc(var(--s) * 4px); right: calc(var(--s) * 4px); bottom: calc(var(--s) * 4px);
  min-height: calc(var(--s) * 30px); padding: 14px 52px 16px 20px; cursor: pointer;
  background: #0e0b2c; color: var(--text);
  box-shadow:
    0 calc(var(--px) * -1) 0 0 var(--text), 0 var(--px) 0 0 var(--text), calc(var(--px) * -1) 0 0 0 var(--text), var(--px) 0 0 0 var(--text),
    inset 0 0 0 var(--px) #0e0b2c, inset 0 0 0 calc(var(--px) * 2) var(--line),
    calc(var(--px) * 2) calc(var(--px) * 3) 0 0 rgba(7, 6, 26, .8);
  animation: pop .2s steps(2, end);
}
@keyframes pop { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }
.dialog-text { font-size: 30px; line-height: 1.25; min-height: 2.5em; text-wrap: pretty; }
.dialog-text .nm { color: var(--gold); }
.dialog-text .nm-acc { color: var(--acc); }
.dialog-next {
  position: absolute; right: 14px; bottom: 12px; width: 34px; height: 30px; padding: 0; border: 0;
  background: transparent; cursor: pointer; display: grid; place-items: center;
}
.dialog-next::before {
  content: ""; width: calc(var(--px) * 5); height: calc(var(--px) * 3); background: var(--text);
  clip-path: polygon(0 0, 100% 0, 100% 33.4%, 80% 33.4%, 80% 66.7%, 60% 66.7%, 60% 100%, 40% 100%, 40% 66.7%, 20% 66.7%, 20% 33.4%, 0 33.4%);
  opacity: 0;
}
.dialog.ready .dialog-next::before { opacity: 1; animation: nudge .6s steps(1, end) infinite; }
.dialog.auto .dialog-next { display: none; }

.log {
  display: flex; gap: 10px; align-items: baseline; min-height: 40px; padding: 8px 14px;
  font-size: 23px; line-height: 1.1; color: var(--muted); background: var(--ink);
}
.log::before { content: ""; flex: none; width: calc(var(--px) * 2); height: calc(var(--px) * 3); background: var(--acc); transform: translateY(-2px); animation: caret 1s steps(1, end) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.log b { color: var(--text); font-weight: 400; }
#log { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.commands { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, .85fr); gap: 16px; }
.commands .btn { padding: 10px 12px; min-height: 54px; font-size: 25px; gap: 8px; }
.cmd .lbl { white-space: nowrap; }
@container (max-width: 610px) {
  .commands { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
}

/* ---------- side panels ---------- */
.panel { background: var(--panel); padding: 18px 20px 20px; min-width: 0; }
.panel h3 { font: 400 15px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.hud { display: grid; gap: 12px; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { font-size: 21px; line-height: 1; padding: 4px 9px 3px; color: var(--ink); background: var(--acc); }
.chip-layer { color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); box-shadow: inset 0 0 0 calc(var(--px) * .67) color-mix(in srgb, var(--acc) 55%, transparent); }
.chip-layer i { display: inline-block; width: calc(var(--px) * 2); height: calc(var(--px) * 2); background: var(--acc); margin-right: 6px; transform: translateY(-1px); }
.pet-name {
  font: 400 34px/1.08 var(--font-display); color: var(--text); text-wrap: balance;
  text-shadow: 3px 3px 0 var(--ink);
}
.pet-name.mythic {
  color: transparent; text-shadow: none;
  background: linear-gradient(90deg, var(--acc) 0 30%, #fff 40%, var(--acc) 50% 80%, #fff 90%, var(--acc) 100%) 0 0 / 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(3px 3px 0 var(--ink));
  animation: shimmer 2.4s steps(12, end) infinite;
}
@keyframes shimmer { to { background-position: -150% 0; } }
.desc { color: var(--muted); font-size: 23px; line-height: 1.15; max-width: 40ch; }

.lvbox { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 4px; }
.lvcard { display: grid; justify-items: center; padding: 6px 12px 4px; background: var(--ink); min-width: 78px; }
.lv-k { font-size: 18px; line-height: 1; color: var(--muted); }
.lv-v { font-size: 50px; line-height: .85; color: var(--gold); text-shadow: 3px 3px 0 #4a3510; }
.expwrap { display: grid; gap: 6px; min-width: 0; }
.exp-top { display: flex; justify-content: space-between; font-size: 20px; line-height: 1; color: var(--muted); }
.exp-top b { color: var(--gold); font-weight: 400; }
.next { font-size: 20px; line-height: 1; color: var(--muted); }
.next b { color: var(--acc); font-weight: 400; }

.meter { display: flex; gap: calc(var(--px) * .67); height: calc(var(--px) * 4); padding: calc(var(--px) * .67); background: var(--ink); }
.meter i { flex: 1 1 0; background: rgba(255, 255, 255, .07); }
.meter i.on { background: var(--mc, var(--acc)); box-shadow: inset 0 calc(var(--px) * .67) 0 0 rgba(255, 255, 255, .35); }
.meter-exp { --mc: var(--gold); height: calc(var(--px) * 5); }

.statskill { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr); gap: 20px; }
@container (max-width: 470px) {
  .statskill > .stats, .statskill > .skill { grid-column: 1 / -1; }
  .statskill > .skill { padding-left: 0; padding-top: 16px; box-shadow: inset 0 calc(var(--px) * .67) 0 0 var(--line); }
}
.stats { display: grid; gap: 9px; align-content: start; }
.stats h3, .skill h3 { margin-bottom: 4px; }
.stat { display: grid; grid-template-columns: 22px 48px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 22px; line-height: 1; }
.stat .ico { color: var(--mc); }
.stat .val { text-align: right; color: var(--text); position: relative; }
.stat .delta {
  position: absolute; right: 0; bottom: 100%; font-size: 18px; color: var(--acc); white-space: nowrap;
  animation: rise 2.2s steps(14, end) forwards;
}
.skill { display: grid; gap: 8px; align-content: start; padding-left: 18px; box-shadow: inset calc(var(--px) * .67) 0 0 0 var(--line); }
.skill-name { display: flex; gap: 8px; align-items: center; font-size: 27px; line-height: 1; color: var(--acc); }
.skill-desc { font-size: 21px; line-height: 1.15; color: var(--muted); }

/* evolution line */
.evo { display: grid; gap: 16px; container-type: inline-size; }
.evo-line { --arrow-w: 30px; --pic-h: 168px; display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr) 30px minmax(0, 1fr); align-items: start; gap: 6px; }
.form { display: grid; gap: 6px; justify-items: center; text-align: center; min-width: 0; }
.form .pic {
  position: relative; width: 100%; height: var(--pic-h); overflow: hidden;
  background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .05));
  box-shadow: inset 0 calc(var(--px) * -2) 0 0 var(--line);
}
.form .pic img { width: 100%; height: 100%; object-fit: none; object-position: 50% 100%; image-rendering: pixelated; display: block; }
.form.locked .pic img { filter: brightness(0) drop-shadow(1px 0 0 #5d50b8) drop-shadow(-1px 0 0 #5d50b8) drop-shadow(0 1px 0 #5d50b8) drop-shadow(0 -1px 0 #5d50b8); opacity: .9; }
.form.locked.peek .pic img { filter: grayscale(.6) brightness(.55); opacity: 1; }
.form .q {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
  font: 400 40px/1 var(--font-display); color: var(--muted); text-shadow: 3px 3px 0 var(--ink);
}
.form.current .pic { background: color-mix(in srgb, var(--acc) 12%, transparent); box-shadow: inset 0 calc(var(--px) * -2) 0 0 var(--acc), inset 0 0 0 calc(var(--px) * .67) color-mix(in srgb, var(--acc) 45%, transparent); }
.form .f-rank { font-size: 19px; line-height: 1; color: var(--muted); }
.form.current .f-rank { color: var(--acc); }
.form .f-name { font-size: 22px; line-height: 1.05; color: var(--text); overflow-wrap: anywhere; min-height: 2.1em; }
.form.locked:not(.peek) .f-name { color: var(--muted); letter-spacing: .2em; }
.form .f-lv { font-size: 19px; line-height: 1; color: var(--gold); }
.form.unlock .pic { animation: unlock .9s steps(1, end); }
@keyframes unlock { 0%, 22%, 44% { background: #fff; } 11%, 33%, 55% { background: transparent; } }
.arrow { display: grid; justify-items: center; gap: 4px; margin-top: calc(var(--pic-h) / 2 - 12px); color: var(--line); }
.arrow.lit { color: var(--acc); }
.arrow span { font-size: 17px; line-height: 1; color: var(--muted); text-align: center; }

@container (max-width: 470px) {
  .evo-line { --arrow-w: 18px; --pic-h: 84px; gap: 4px; }
  .form .pic img { object-position: var(--pp, 50% 0); }
  .form .q { font-size: 28px; }
  .arrow span { display: none; }
  .form .f-name { font-size: 19px; }
}

.keys { font-size: 19px; color: var(--muted); text-align: center; }
.keys kbd { font: inherit; color: var(--text); background: var(--panel-hi); padding: 1px 5px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(7, 6, 26, .78); }
.modal-box { --bc: #ff6b6b; width: min(440px, 100%); display: grid; gap: 14px; padding: 22px; }
.modal-box h2 { font: 400 22px/1.1 var(--font-display); color: var(--text); }
.modal-box p { color: var(--muted); font-size: 23px; line-height: 1.15; }
.modal-row { display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.btn-danger { --bg: #ff6b6b; --fg: var(--ink); --bc: var(--text); text-shadow: none; }
.btn-danger:hover { --bg: #ff8585; }

/* evolution: the rest of the screen steps back */
.top, .side, .commands, .log, .keys { transition: opacity .6s steps(6), filter .6s steps(6); }
body.evolving .top, body.evolving .side, body.evolving .commands, body.evolving .log, body.evolving .keys { opacity: .28; filter: saturate(.3); }

.nodata { padding: 28px; font-size: 26px; line-height: 1.2; color: var(--text); background: var(--panel); }

/* ---------- responsive ---------- */
@media (max-width: 1439px) {
  .sys .lbl { display: none; }

}
@media (max-width: 1180px) {

}
@media (max-width: 979px) {
  .game { grid-template-columns: minmax(0, 1fr); }

  .side .evo { grid-column: 1 / -1; }

}
@media (max-width: 760px) {

@media (max-width: 640px) {

}

/* reduced motion: keep it calm */
@media (prefers-reduced-motion: reduce) {
  .dialog.ready .dialog-next::before, .log::before { animation: none; }
  .pet-name.mythic { animation-duration: 8s; }

}
@keyframes rise-rm { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: calc(var(--s) * -4px); } }

<script src="data/pets.js"></script>
<script>
(() => {
  'use strict';

  /* ================= data ================= */
  const PETS = (Array.isArray(window.IQX_PETS) ? window.IQX_PETS : [])
    .filter((p) => p && p.slug && Array.isArray(p.stages) && p.stages.length);
  const $ = (s) => document.querySelector(s);
  const NF = (s) => String(s == null ? '' : s).normalize('NFC');

  if (!PETS.length) {
    $('#game').innerHTML = '<p class="nodata pxb">Chưa tải được dữ liệu linh thú (data/pets.js). Hãy mở trang từ thư mục game/.</p>';
    return;
  }

  const SPR = 192, FEET = 188, PET_TOP = -8, ARENA_H = PET_TOP + SPR + 9; // the top 8 sprite rows are always empty sky
  const MAX_LV = 99;
  const STATS = [['hp', 'HP', 'heart', 'var(--hp)'], ['atk', 'Công', 'sword', 'var(--atk)'], ['def', 'Thủ', 'shield', 'var(--def)'], ['spd', 'Tốc', 'bolt', 'var(--spd)']];
  const STAT_MAX = Math.max(100, ...PETS.flatMap((p) => p.stages.flatMap((s) => STATS.map(([k]) => +((s.stats || {})[k]) || 0))));
  const needExp = (lv) => 20 + lv * 6;
  const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = RMQ.matches;
  const setRM = () => document.documentElement.classList.toggle('rm', reduced);
  setRM();
  try { RMQ.addEventListener('change', (e) => { reduced = e.matches; setRM(); }); } catch (e) { /* old browsers */ }

  const stageFor = (pet, lv) => { let i = 0; pet.stages.forEach((s, k) => { if (lv >= (+s.level || 1)) i = k; }); return i; };
  const stageName = (pet, i) => NF(pet.stages[i].name) || NF(pet.name);
  const skillOf = (pet, i) => {
    const sk = pet.stages[i].skill || {};
    return { name: NF(sk.name) || 'Tuyệt kỹ ' + NF(pet.layer || pet.name), desc: NF(sk.desc) };
  };
  const hex = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(h || '').trim()); const n = parseInt(m ? m[1] : '22d3ee', 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t));
  const css = (c, a) => a == null ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ================= state ================= */
  const KEY = 'iqx-linh-thu-v1';
  const fresh = () => ({ sel: PETS[0].slug, muted: false, reveal: false, pets: {} });
  let state = fresh();
  function loadState(src) {
    let raw = src;
    if (!raw) { try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; } }
    const s = fresh();
    if (raw && typeof raw === 'object') {
      if (PETS.some((p) => p.slug === raw.sel)) s.sel = raw.sel;
      s.muted = !!raw.muted; s.reveal = !!raw.reveal;
      const rp = raw.pets && typeof raw.pets === 'object' ? raw.pets : {};
      PETS.forEach((p) => {
        const r = rp[p.slug];
        if (r && typeof r === 'object') {
          const lv = Math.max(1, Math.min(MAX_LV, Math.floor(+r.lv) || 1));
          s.pets[p.slug] = { lv, exp: Math.max(0, Math.min(needExp(lv) - 1, Math.floor(+r.exp) || 0)), st: stageFor(p, lv) };
        }
      });
    }
    PETS.forEach((p) => { if (!s.pets[p.slug]) s.pets[p.slug] = { lv: 1, exp: 0, st: stageFor(p, 1) }; });
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: keep playing in memory */ } }
  const cur = () => PETS.find((p) => p.slug === state.sel) || PETS[0];
  const ps = (pet) => state.pets[pet.slug];

  /* ================= pixel icons ================= */
  const ICONS = {
    food: { rows: ['.kkkkkkk.', 'kGgg#gggk', 'kgGg#gGgk', 'kggg#gggk', 'k#######k', 'kggg#gggk', 'kgGg#gGgk', 'kggg#gggk', '.kkkkkkk.'], pal: { k: '#0b2a14', g: '#2f9e4f', G: '#5fd27a', '#': '#e9d29a' } },
    train: { rows: ['.##...##.', '###...###', '#########', '#########', '###...###', '.##...##.'] },
    skill: { rows: ['....#....', '....#....', '...###...', '..#####..', '#########', '..#####..', '...###...', '....#....', '....#....'] },
    up: { rows: ['....#....', '...###...', '..##.##..', '.##...##.', '....#....', '...###...', '..##.##..', '.##...##.'] },
    sound: { rows: ['...#.....', '..##..#..', '####...#.', '####.#.#.', '####.#.#.', '####...#.', '..##..#..', '...#.....'] },
    mute: { rows: ['...#.....', '..##.....', '####.#.#.', '####..#..', '####.#.#.', '####.....', '..##.....', '...#.....'] },
    reset: { rows: ['..####.#.', '.#....##.', '#....###.', '#........', '#.......#', '#.......#', '.#.....#.', '..#####..'] },
    heart: { rows: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'] },
    sword: { rows: ['.....##', '....###', '...###.', '#.###..', '.###...', '..#....', '.#.#...'] },
    shield: { rows: ['#######', '#######', '#######', '#######', '.#####.', '..###..', '...#...'] },
    bolt: { rows: ['...###.', '..###..', '.###...', '######.', '..###..', '.###...', '.#.....'] },
    arrow: { rows: ['....#...', '....##..', '#######.', '########', '#######.', '....##..', '....#...'] },
    egg: { rows: ['...kk...', '..kwwk..', '.kwwwwk.', '.kwawwk.', 'kwwwwawk', 'kwawwwwk', 'kwwwwwwk', 'kwwaawwk', '.kwwwwk.', '..kkkk..'], pal: { k: '#07061a', w: '#fff3d6', a: 'var(--acc)' } },
  };
  function iconSVG(name) {
    const ic = ICONS[name]; const h = ic.rows.length, w = ic.rows[0].length;
    let out = '';
    ic.rows.forEach((row, y) => {
      let x = 0;
      while (x < w) {
        const ch = row[x];
        if (ch === '.') { x++; continue; }
        let e = x; while (e < w && row[e] === ch) e++;
        const fill = ic.pal ? (ic.pal[ch] || 'currentColor') : 'currentColor';
        out += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${fill}"/>`;
        x = e;
      }
    });
    return `<svg viewBox="0 0 ${w} ${h}" style="--w:${w};--h:${h}" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${out}</svg>`;
  }
  document.querySelectorAll('[data-ico]').forEach((el) => { el.innerHTML = iconSVG(el.dataset.ico); });
  $('#logoEgg').innerHTML = iconSVG('egg');

  /* ================= sprites ================= */
  const IMG = {}, BOX = {};
  function img(path) {
    if (!IMG[path]) {
      const im = new Image();
      im.onload = () => { measure(path); onSpriteLoaded(); };
      im.src = path; IMG[path] = im;
    }
    return IMG[path];
  }
  function measure(path) {
    const im = IMG[path];
    try {
      const c = document.createElement('canvas'); c.width = SPR; c.height = SPR;
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, SPR, SPR).data; // throws on file:// (opaque origin): fall back to estimates
      let x0 = SPR, y0 = SPR, x1 = 0, y1 = 0; const edge = [];
      const A = (x, y) => (x < 0 || y < 0 || x >= SPR || y >= SPR) ? 0 : d[(y * SPR + x) * 4 + 3];
      for (let y = 0; y < SPR; y++) for (let x = 0; x < SPR; x++) {
        if (!A(x, y)) continue;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (!A(x - 1, y) || !A(x + 1, y) || !A(x, y - 1) || !A(x, y + 1)) edge.push(x, y);
      }
      if (x1 > x0) BOX[path] = { x0, y0, x1: x1 + 1, y1: y1 + 1, edge };
    } catch (e) { /* estimate used */ }
  }
  function boxOf(pet, i) {
    const b = BOX[pet.stages[i].sprite];
    if (b) return b;
    const f = pet.stages.length > 1 ? i / (pet.stages.length - 1) : 0;
    const w = Math.round(100 + 52 * f), h = Math.round(106 + 52 * f);
    return { x0: 96 - (w >> 1), x1: 96 + (w >> 1), y0: FEET + 1 - h, y1: FEET + 1, edge: null };
  }
  PETS.forEach((p) => p.stages.forEach((s) => { img(s.sprite); if (s.blink) img(s.blink); }));
  let spriteTimer = 0;
  function onSpriteLoaded() { clearTimeout(spriteTimer); spriteTimer = setTimeout(() => { placeHit(); renderRoster(); renderEvo(); rebuildAura(); }, 60); }

  /* ================= sound ================= */
  const NOTE = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, D6: 1174.7, E6: 1318.5, G6: 1568, C7: 2093 };
  const Sfx = {
    ctx: null, master: null, muted: false,
    wake() {
      if (this.muted) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; return; }
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },
    ok() { return !!this.ctx && !this.muted && this.ctx.state === 'running'; },
    tone(f, d, o = {}) {

  }
  function afterGain(ups, delay = 0) {
    const pet = cur(), p = ps(pet);
    save(); renderHUD(); renderRoster(); renderEvo();
    if (ups) {
      setTimeout(() => {
        floatText('LÊN CẤP!', 'big', 0, -12); Sfx.level(); sparkles(14);
        say(['Lên ', ['cấp ' + p.lv], '! ', stageName(pet, p.st), ' mạnh hơn rồi.']);
      }, delay);
    }
    if (stageFor(pet, p.lv) > p.st) setTimeout(() => runEvolution(), delay + (ups ? 900 : 300));
  }
  function feed() {
    if (busy) return; Sfx.wake(); const pet = cur(), p = ps(pet);
    if (p.lv >= MAX_LV) { say([stageName(pet, p.st), ' đã đạt cấp tối đa.']); return; }
    const n = 12 + Math.floor(Math.random() * 6); const c = center();
    emit({ k: 'bmp', bmp: BMP.food, x: c.x, y: c.top - 26, vy: 0.4, ay: 0.12, life: 26, drag: 0.99 });
    Sfx.feed();
    setTimeout(() => {
      const c2 = center();
      for (let i = 0; i < nP(10); i++) emit({ x: c2.x + (Math.random() - 0.5) * 8, y: c2.top + c2.h * 0.3, vx: (Math.random() - 0.5) * 1.6, vy: -Math.random() * 1.6, ay: 0.12, c: ['#e9d29a', '#2f9e4f', '#5fd27a'][i % 3], life: 30 + Math.random() * 20 });
      hop(4, 300); hearts(2); floatText('+' + n + ' EXP');
      const ups = gainExp(n);
      say([stageName(pet, p.st), ' ăn bánh chưng ngon lành. ', ['+' + n + ' EXP']]);
      afterGain(ups, 250);
    }, reduced ? 50 : 380);
  }
  function train() {
    if (busy) return; Sfx.wake(); const pet = cur(), p = ps(pet);
    if (p.lv >= MAX_LV) { say([stageName(pet, p.st), ' đã đạt cấp tối đa.']); return; }
    const n = 28 + Math.floor(Math.random() * 10);
    Sfx.train(); hop(22, 640);
    const c = center();
    emit({ k: 'bmp', bmp: BMP.sweat, x: c.x + c.w * 0.32, y: c.top + 6, vx: 0.5, vy: -0.8, ay: 0.08, life: 36 });
    motion.onLand = () => {
      const c2 = center(); shakeUntil = performance.now() + 160;
      for (let i = 0; i < nP(16); i++) { const side = i % 2 ? 1 : -1; emit({ x: c2.x + side * c2.w * 0.3, y: c2.feet - 1, vx: side * (0.4 + Math.random() * 1.2), vy: -Math.random() * 0.7, drag: 0.93, c: i % 3 ? '#4b4290' : '#7a70c0', s: 2, life: 26 + Math.random() * 14 }); }
      floatText('+' + n + ' EXP');
      const ups = gainExp(n);
      say([stageName(pet, p.st), ' luyện tập chăm chỉ! ', ['+' + n + ' EXP']]);
      afterGain(ups, 150);
    };
  }
  function useSkill() {
    if (busy) return; Sfx.wake(); const pet = cur(), p = ps(pet); const sk = skillOf(pet, p.st);
    const style = String(pet.element || '').split('_')[0];
    Sfx.skill(); flash('tint'); showBanner(sk.name); hop(5, 320);
    shakeUntil = performance.now() + 320;
    const c = center(); const acc = css(L.accent);
    ring(c.x, c.y + c.h * 0.2, acc, 1.8, 46); setTimeout(() => ring(c.x, c.y + c.h * 0.2, '#ffffff', 2.2, 36), 120);
    burst(70 + p.st * 30, { style });
    sparkles(10);
    const n = 6;
    const ups = p.lv < MAX_LV ? gainExp(n) : 0;
    say([stageName(pet, p.st), ' tung chiêu ', [sk.name], '!']);
    afterGain(ups, 600);
  }
  function plusFive() {
    if (busy) return; Sfx.wake(); const pet = cur(), p = ps(pet);
    if (p.lv >= MAX_LV) return;
    const before = p.lv; p.lv = Math.min(MAX_LV, p.lv + 5); p.exp = 0;
    floatText('+' + (p.lv - before) + ' CẤP', 'big', 0, -12); Sfx.level(); sparkles(16); hop(6, 360);
    for (let i = 0; i < nP(14); i++) { const c = center(); emit({ x: c.x + (Math.random() - 0.5) * c.w * 0.8, y: c.feet - Math.random() * 6, vy: -0.6 - Math.random() * 1.2, c: i % 2 ? '#ffd25e' : '#fff3c4', life: 40 + Math.random() * 30, s: i % 4 ? 1 : 2 }); }
    say([stageName(pet, p.st), ' lĩnh hội bí kíp: ', ['cấp ' + before + ' → ' + p.lv], '.']);
    save(); renderHUD(); renderRoster(); renderEvo();
    if (stageFor(pet, p.lv) > p.st) setTimeout(() => runEvolution(), 700);
  }
  function tapPet() {
    if (busy) return; Sfx.wake(); Sfx.tap(); hop(6, 360); hearts(4);
    const pet = cur(), p = ps(pet);
    const lines = [' rất thích được vuốt ve.', ' dụi đầu vào tay bạn.', ' vui vẻ nhảy cẫng lên.', ' nhìn bạn đầy tin tưởng.'];
    say([[stageName(pet, p.st)], lines[Math.floor(Math.random() * lines.length)]]);
  }
  function idle() {
    clearTimeout(idleT);
    idleT = setTimeout(() => {
      if (!busy && !reduced && !motion.kind && !document.hidden) {
        if (Math.random() < 0.5) hop(3, 280);
        else { const c = center(); emit({ k: 'bmp', bmp: BMP.note, x: c.x + c.w * 0.34, y: c.top + 4, vx: 0.15, vy: -0.35, wob: 1, life: 70 }); }
      }
      idle();
    }, 7000 + Math.random() * 6000);
  }

  function selectPet(slug, instant) {
    if (busy || slug === state.sel) { if (slug === state.sel) renderRoster(); return; }
    state.sel = slug; save(); Sfx.ui();
    const swap = () => {
      parts.length = 0; rings.length = 0; aura.parts = []; renderAll();
      const pet = cur(), p = ps(pet); say(['Đã chọn ', [stageName(pet, p.st)], '. ' + NF(pet.tagline)]);
      if (stageFor(pet, p.lv) > p.st) setTimeout(runEvolution, 600);
    };
    renderRoster();
    if (instant || reduced) swap(); else wipe = { t0: performance.now(), dur: 520, swapped: false, swap };
  }

  /* ================= dialog ================= */
  const dialog = $('#dialog'), dlgText = $('#dlgText'), dlgLive = $('#dlgLive'), dlgNext = $('#dlgNext');
  let dlgAdvance = null, dlgLastAdv = 0;
  function speak(segs, opt = {}) {
    return new Promise((resolve) => {
      const auto = opt.auto || 0;
      segs = segs.map(([t, c]) => [NF(t), c]);
      const full = segs.map((s) => s[0]).join('');
      dialog.hidden = false; dialog.classList.toggle('auto', !!auto); dialog.classList.remove('ready');
      dlgLive.textContent = full; dlgText.textContent = '';
      const spans = segs.map(([t, c]) => { const sp = document.createElement('span'); if (c) sp.className = c; dlgText.appendChild(sp); return [sp, t]; });
      let n = 0, typing = true, timer = 0, autoT = 0;
      const render = () => { let left = n; spans.forEach(([sp, t]) => { sp.textContent = t.slice(0, Math.max(0, Math.min(t.length, left))); left -= t.length; }); };
      const close = () => { clearInterval(timer); clearTimeout(autoT); dialog.hidden = true; dlgAdvance = null; resolve(); };
      const finish = () => { clearInterval(timer); n = full.length; render(); typing = false; dialog.classList.add('ready'); if (auto) autoT = setTimeout(close, skipping ? 0 : auto); };
      dlgAdvance = () => { const t = performance.now(); if (t - dlgLastAdv < 160) return; dlgLastAdv = t; if (typing) finish(); else close(); };
      if (reduced || skipping) finish();
      else timer = setInterval(() => { n++; render(); if (n % 2 === 0) Sfx.tick(); if (n >= full.length) finish(); }, 28);
      if (!auto) setTimeout(() => dlgNext.focus({ preventScroll: true }), 30);
    });
  }
  dialog.addEventListener('click', () => dlgAdvance && dlgAdvance());

  /* ================= evolution sequence ================= */
  let skipping = false; const waiters = new Set();
  const sleep = (ms) => new Promise((r) => { if (skipping) return r(); const t = setTimeout(() => { waiters.delete(done); r(); }, ms); const done = () => { clearTimeout(t); r(); }; waiters.add(done); });
  function skipEvo() { if (!evo.active || skipping) return; skipping = true; waiters.forEach((f) => f()); waiters.clear(); if (dlgAdvance && dialog.classList.contains('auto')) dlgAdvance(); }
  $('#skipBtn').addEventListener('click', skipEvo);
  const lockEls = ['#top', '#side', '#commands', '#keys'].map($);
  function lock(on) {
    busy = on; document.body.classList.toggle('evolving', on);
    lockEls.forEach((el) => { el.inert = on; });
    petHit.disabled = on; $('#skipBtn').hidden = !on;
  }

  async function runEvolution() {
    const pet = cur(), p = ps(pet);
    if (busy || evo.active) return;
    const from = p.st, to = from + 1;
    if (!pet.stages[to] || stageFor(pet, p.lv) < to) return;
    const fromSt = pet.stages[from], toSt = pet.stages[to];
    const oldName = stageName(pet, from), newName = stageName(pet, to);
    const returnFocus = document.activeElement;
    lock(true); evo.active = true; skipping = false;
    motion.kind = null; parts.length = 0; rings.length = 0;
    petA.src = fromSt.sprite; petB.src = toSt.sprite;
    const c = center(); evo.cx = c.x; evo.cy = c.y + 4;
    say(['Ơ kìa? ', [oldName], ' đang phát sáng...']);
    Sfx.hum();
    // 1. lights down, body turns to light
    arena.classList.add('dimmed');
    petPos.classList.remove('mythic');
    await speak([['Ơ kìa? '], [oldName, 'nm'], [' đang tiến hoá!']], { auto: 800 });
    petPos.classList.add('sil-in', 'sil');
    evo.converge = true;
    for (let i = 0; i < 10 && !skipping; i++) { evo.rays = i / 40; await sleep(60); }

    // 2. flicker between the two forms, faster and faster
    if (reduced) {
      petPos.classList.add('xfade'); petB.style.opacity = '0'; petB.classList.remove('off');
      void petB.offsetWidth; petB.style.opacity = '1'; petA.style.opacity = '0'; evo.rays = 0.35;
      await sleep(1800);
    } else {
      let gap = 430, k = 0; const t0 = performance.now();
      while (!skipping && performance.now() - t0 < 3600) {
        const showNew = k % 2 === 0;
        petA.classList.toggle('off', showNew); petB.classList.toggle('off', !showNew);
        Sfx.evoTick(k);
        evo.rays = Math.min(1, 0.25 + (performance.now() - t0) / 3600 * 0.75);
        if (k % 3 === 0) sparkles(3, ['#ffffff', css(L.accent), '#ffffff']);
        await sleep(gap); gap = Math.max(34, gap * 0.82); k++;
      }
    }

    // 3. white-out
    evo.converge = false;
    flash(); Sfx.boom(); shakeUntil = performance.now() + 420;
    p.st = to; save();
    await sleep(140);
    petPos.classList.remove('sil', 'sil-in', 'xfade');
    petA.style.opacity = ''; petB.style.opacity = '';
    petA.src = toSt.sprite; petA.classList.remove('off'); petB.classList.add('off');
    petAura.src = toSt.sprite; petPos.classList.toggle('mythic', to === pet.stages.length - 1);
    evo.rays = 0; arena.classList.remove('dimmed');
    const deltas = {};
    STATS.forEach(([k]) => { const a = +((fromSt.stats || {})[k]) || 0, b = +((toSt.stats || {})[k]) || 0; deltas[k] = b - a; deltas[k + '0'] = a; });
    rebuildAura(); placeHit();
    const c2 = center(); evo.cx = c2.x; evo.cy = c2.y;
    ring(c2.x, c2.y, '#ffffff', 2.6, 50); ring(c2.x, c2.y, css(L.accent), 1.7, 60);
    burst(140, { speed: 3.4, gravity: 0.025 });
    hop(10, 520);
    document.body.classList.remove('evolving');
    renderHUD(deltas); renderRoster(); renderEvo(to);
    evo.active = false;
    showBanner(NF(toSt.rank) || newName);
    setTimeout(() => sparkles(18), 300);
    await sleep(1100);

    // 4. the dialog
    Sfx.fanfare();
    say(['Chúc mừng! ', [oldName], ' đã tiến hoá thành ', [newName], '!']);
    $('#skipBtn').hidden = true; skipping = false;
    await speak([['Chúc mừng! '], [oldName, 'nm'], [' đã tiến hoá thành '], [newName, 'nm-acc'], ['!']]);
    lock(false);
    if (to === pet.stages.length - 1) say([[newName], ' đã đạt hình thái tối thượng. Hào quang Thần thú bao quanh!']);
    try { (returnFocus && returnFocus.isConnected ? returnFocus : $('#feedBtn')).focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    if (stageFor(pet, p.lv) > p.st) setTimeout(runEvolution, 400);
  }

  /* ================= confirm (reset) ================= */
  const confirmEl = $('#confirm'); let confirmReturn = null;
  function openConfirm() {
    if (busy) return; Sfx.wake(); Sfx.ui();
    $('#confirmText').textContent = `Cấp độ, EXP và các lần tiến hoá của cả ${PETS.length} linh thú sẽ trở về ban đầu.`;
    confirmReturn = document.activeElement; confirmEl.hidden = false; $('#app').inert = true;
    $('#confirmNo').focus();
  }
  function closeConfirm(doReset) {
    confirmEl.hidden = true; $('#app').inert = false;
    if (doReset) {
      const keep = { muted: state.muted, sel: state.sel };
      state = loadState({ sel: keep.sel, muted: keep.muted, reveal: false, pets: {} });
      save(); parts.length = 0; aura.parts = []; renderAll();
      say(['Đã đặt lại tiến trình. Bắt đầu hành trình mới!']);
      hearts(3);
    }
    try { (confirmReturn || $('#resetBtn')).focus(); } catch (e) { /* ignore */ }
  }
  $('#resetBtn').addEventListener('click', openConfirm);
  $('#confirmNo').addEventListener('click', () => closeConfirm(false));
  $('#confirmYes').addEventListener('click', () => { Sfx.ui(); closeConfirm(true); });
  confirmEl.addEventListener('click', (e) => { if (e.target === confirmEl) closeConfirm(false); });

  /* ================= wiring ================= */
  $('#feedBtn').addEventListener('click', feed);
  $('#trainBtn').addEventListener('click', train);
  $('#skillBtn').addEventListener('click', useSkill);
  $('#lvBtn').addEventListener('click', plusFive);
  petHit.addEventListener('click', tapPet);
  $('#revealBtn').addEventListener('click', () => { Sfx.wake(); Sfx.ui(); state.reveal = !state.reveal; save(); renderEvo(); });
  function renderSound() {
    const b = $('#soundBtn'); b.setAttribute('aria-pressed', String(!state.muted));
    $('#soundIco').innerHTML = iconSVG(state.muted ? 'mute' : 'sound');
    b.querySelector('.lbl').textContent = state.muted ? 'Tắt tiếng' : 'Âm thanh';
    b.setAttribute('aria-label', state.muted ? 'Bật âm thanh' : 'Tắt âm thanh');
  }
  function toggleSound() { state.muted = !state.muted; Sfx.muted = state.muted; save(); renderSound(); Sfx.wake(); Sfx.ui(); }
  $('#soundBtn').addEventListener('click', toggleSound);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!confirmEl.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeConfirm(false); }
      if (e.key === 'Tab') { const a = $('#confirmNo'), b = $('#confirmYes'); e.preventDefault(); (document.activeElement === a ? b : a).focus(); }
      return;
    }
    if (!dialog.hidden && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); dlgAdvance && dlgAdvance(); return; }
    if (evo.active && e.key === 'Escape') { e.preventDefault(); skipEvo(); return; }
    if (busy) return;
    const k = e.key.toLowerCase();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= PETS.length) { Sfx.wake(); selectPet(PETS[n - 1].slug); }
    else if (k === 'a') feed();
    else if (k === 'l') train();
    else if (k === 'k') useSkill();
    else if (k === '+' || k === '=') plusFive();
    else if (k === 'm') toggleSound();
  });

  /* ================= boot ================= */
  function start(data) {
    state = loadState(data && data.state);
    Sfx.muted = state.muted;
    $('#keyMax').textContent = PETS.length;
    renderSound();
    layout(); renderAll();
    const pet = cur();
    say(['Chào mừng tới Đền Tứ Linh! ', [stageName(pet, ps(pet).st)], ' đang chờ bạn chăm sóc.']);
    let roRaf = 0;
    if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(roRaf); roRaf = requestAnimationFrame(() => { layout(); renderRoster(); }); }).observe(arenaBox);
    else addEventListener('resize', layout);
    scheduleBlink(); idle();
    requestAnimationFrame((t) => { last = t; frame(t); });
    try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ state })); } catch (e) { /* not in a viewer */ }
  }
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
  } catch (e) { start({}); }
})();
</script>
